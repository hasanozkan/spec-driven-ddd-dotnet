name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: make check

  # One spec, two implementations: this repository's specs must be
  # byte-identical to the Python implementation's.
  spec-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hasanozkan/spec-driven-ddd-sample
          path: python-impl
      - run: diff -r python-impl/specs specs && echo "specs identical to the Python implementation"

  # Behavioural conformance: the Python implementation's smoke test, unchanged.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: |
          dotnet run --project src/Library.Api --urls http://localhost:8000 &
          timeout 120 bash -c 'until curl -fs localhost:8000/healthz; do sleep 2; done'
          make conformance

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
